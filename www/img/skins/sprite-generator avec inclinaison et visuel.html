<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Sprite Generator + Preview</title>

<style>
  body {
    background:#111;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
  }

  canvas {
    background:black;
    border:1px solid #333;
    margin:10px;
    image-rendering: pixelated;
  }

  input, button {
    margin:6px;
    padding:8px 14px;
    font-size:14px;
    cursor:pointer;
  }

  .row {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
  }
</style>
</head>

<body>

<h2>Générateur sprite sheet + simulateur</h2>

<input type="file" id="upload" accept="image/png">

<div class="row">
  <div>
    <p>Sprite sheet</p>
    <canvas id="sheet"></canvas>
  </div>

  <div>
    <p>Simulation</p>
    <canvas id="preview" width="256" height="256"></canvas>
  </div>
</div>

<button onclick="download()">Télécharger sprite sheet</button>

<script>
/* ===========================================================
   CONFIG
=========================================================== */
const FRAME_SIZE  = 256;
const FRAME_COUNT = 6;
const FPS = 12;

const MAX_ANGLE =0;

function getRotation(frameIndex) {
  return Math.sin(
    (frameIndex / FRAME_COUNT) * Math.PI * 2
  ) * MAX_ANGLE;
}


/* ===========================================================
   CANVAS
=========================================================== */
const sheet = document.getElementById("sheet");
sheet.width  = FRAME_SIZE * FRAME_COUNT;
sheet.height = FRAME_SIZE;

const ctxSheet = sheet.getContext("2d");

const preview = document.getElementById("preview");
const ctxPreview = preview.getContext("2d");

/* ===========================================================
   IMAGE
=========================================================== */
let skinImg = new Image();
let animationRunning = false;

/* ===========================================================
   UPLOAD
=========================================================== */
document.getElementById("upload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  skinImg.src = URL.createObjectURL(file);
  skinImg.onload = () => {
    generateSheet();
    startPreview();
  };
});

/* ===========================================================
   DRAW ONE FRAME (ROTATION)
=========================================================== */
function drawFrame(frameIndex) {
  const offsetX = frameIndex * FRAME_SIZE;
  ctxSheet.clearRect(offsetX, 0, FRAME_SIZE, FRAME_SIZE);

  const angleDeg = getRotation(frameIndex);
  const angleRad = angleDeg * Math.PI / 180;

  ctxSheet.save();
  ctxSheet.translate(offsetX + FRAME_SIZE / 2, FRAME_SIZE / 2);
  ctxSheet.rotate(angleRad);

  ctxSheet.drawImage(
    skinImg,
    -skinImg.width / 2,
    -skinImg.height / 2
  );

  ctxSheet.restore();
}


/* ===========================================================
   GENERATE SPRITE SHEET
=========================================================== */
function generateSheet() {
  ctxSheet.clearRect(0, 0, sheet.width, sheet.height);
  for (let i = 0; i < FRAME_COUNT; i++) {
    drawFrame(i);
  }
}

/* ===========================================================
   PREVIEW ANIMATION
=========================================================== */
let frame = 0;
let lastTime = 0;

function startPreview() {
  animationRunning = true;
  frame = 0;
  requestAnimationFrame(loop);
}

function loop(time) {
  if (!animationRunning) return;

  if (time - lastTime > 1000 / FPS) {
    ctxPreview.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);

    ctxPreview.drawImage(
      sheet,
      frame * FRAME_SIZE, 0, FRAME_SIZE, FRAME_SIZE,
      0, 0, FRAME_SIZE, FRAME_SIZE
    );

    frame = (frame + 1) % FRAME_COUNT;
    lastTime = time;
  }

  requestAnimationFrame(loop);
}

/* ===========================================================
   DOWNLOAD
=========================================================== */
function download() {
  const link = document.createElement("a");
  link.download = "spritesheet_6x256_rotated.png";
  link.href = sheet.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
