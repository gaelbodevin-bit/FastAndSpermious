<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sprite Generator – Rotation + Mirror</title>
<style>
    body {
        background: #1a1a2e;
        color: #fff;
        text-align: center;
        font-family: Arial;
        padding: 40px;
    }
    canvas {
        image-rendering: pixelated;
        margin-top: 20px;
        background: transparent;
    }
</style>
</head>
<body>

<h1>Sprite Sheet – Rotation + Miroir</h1>
<p>Charge ton skin 256×256 PNG sans fond :</p>

<input type="file" id="fileInput" accept="image/png">
<canvas id="preview" width="1536" height="256"></canvas>
<br>
<button id="downloadBtn" style="display:none;">Télécharger</button>

<script>
// Taille frame
const SIZE = 256;

// 6 frames avec variations rotation + miroir
const FRAMES = [
    { angle: -6, mirror: false },
    { angle: -3, mirror: true  },
    { angle:  0, mirror: false },
    { angle:  3, mirror: true  },
    { angle:  6, mirror: false },
    { angle:  3, mirror: true  },
];

const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("preview");
const ctx = canvas.getContext("2d");
const downloadBtn = document.getElementById("downloadBtn");

fileInput.addEventListener("change", async (e) => {
    const img = await loadImg(URL.createObjectURL(e.target.files[0]));
    generate(img);
    downloadBtn.style.display = "block";
});

function loadImg(src) {
    return new Promise(res => {
        const img = new Image();
        img.onload = () => res(img);
        img.src = src;
    });
}

function generate(img) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    FRAMES.forEach((frame, i) => {
        const offX = i * SIZE;

        ctx.save();

        // aller au centre de la frame
        ctx.translate(offX + SIZE / 2, SIZE / 2);

        // miroir horizontal si demandé
        if (frame.mirror) ctx.scale(-1, 1);

        // rotation
        ctx.rotate(frame.angle * Math.PI / 180);

        // dessiner l’image centrée
        ctx.drawImage(img, -SIZE / 2, -SIZE / 2, SIZE, SIZE);

        ctx.restore();
    });
}

downloadBtn.addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "sprite_mirror_rotate.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
});
</script>

</body>
</html>
