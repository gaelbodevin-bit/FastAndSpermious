<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sprite Generator – Fast & Spermious</title>
<style>
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
canvas {
  border: 1px solid #555;
  margin-top: 20px;
}
button {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>Sprite Generator</h1>

<input type="file" id="fileInput" accept="image/png"><br>

<canvas id="canvas" width="1536" height="256"></canvas><br>

<button id="downloadBtn">Download sprite</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const input = document.getElementById("fileInput");
const downloadBtn = document.getElementById("downloadBtn");

const FRAME_SIZE = 256;
const FRAMES = 6;

input.addEventListener("change", () => {
  const file = input.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < FRAMES; i++) {
      ctx.save();
      ctx.translate(i * FRAME_SIZE + FRAME_SIZE / 2, FRAME_SIZE / 2);

      // rotation légère uniquement (PAS de miroir)
      const angle = (i - (FRAMES - 1) / 2) * 0.12;
      ctx.rotate(angle);

      ctx.drawImage(
        img,
        -FRAME_SIZE / 2,
        -FRAME_SIZE / 2,
        FRAME_SIZE,
        FRAME_SIZE
      );

      ctx.restore();
    }
  };

  img.src = URL.createObjectURL(file);
});

downloadBtn.addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "sprite.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});
</script>

</body>
</html>
