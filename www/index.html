<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>Fast and Spermious</title>

  <!-- =============================== -->
  <!--            CSS                 -->
  <!-- =============================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Fond particules derrière tout */
    #bgCanvas { z-index: -1 !important; }

    /* ===== OVERLAY CONNEXION GOOGLE (bloque le jeu) ===== */
    .google-btn {
      display: flex; align-items: center; gap: 12px;
      background: #fff; color: #3c4043;
      border: none; border-radius: 24px;
      padding: 13px 26px; font-size: 16px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .google-btn:active { transform: scale(0.97); }

    /* Label utilisateur + bouton premium dans le menu */
    #userLabel { color: #888; font-size: 13px; margin-top: 8px; min-height: 16px; }
    #btnPremium {
      background: linear-gradient(90deg,#f5c518,#ff9900) !important;
      color: #000 !important; font-weight: bold;
    }

    /* ===== OVERLAY PUB INTERSTITIELLE ===== */
    #adOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 90000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    #adOverlay .ad-title { color: #fff; font-size: 22px; font-weight: bold; }
    #adOverlay .ad-placeholder {
      width: 300px; height: 250px;
      background: #111; border: 1px solid #333; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 13px;
    }
    #adOverlay .ad-counter { color: #aaa; font-size: 16px; min-height: 20px; }
    #adOverlay .ad-skip {
      padding: 10px 30px; border: none; border-radius: 20px;
      background: #ff4ca3; color: #fff; font-size: 16px; cursor: pointer;
    }
    #adOverlay .ad-skip:disabled { opacity: 0.4; cursor: default; }
  </style>
  <link rel="stylesheet" href="css/intro.css">

  <!-- =============================== -->
  <!--          FIREBASE SDK           -->
  <!-- =============================== -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
</head>

<body>

  <!-- =============================== -->
  <!--      MODAL INFO SKINS (UI)      -->
  <!-- =============================== -->
  <div id="skinsInfoModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="skinsInfoTitle"></h2>

      <p id="skinsInfoBody"></p>

      <label class="dont-show">
        <input type="checkbox" id="dontShowSkinsInfo">
        <span id="skinsInfoDontShow"></span>
      </label>

      <button id="closeSkinsInfo"></button>
    </div>
  </div>



  <!-- =============================== -->
  <!--        INTRO ONE CELL STUDIO    -->
  <!-- =============================== -->
  <div id="studio-intro">
    <div id="studio-text">Blue Cell Production</div>
  </div>

  <!-- =============================== -->
  <!--          MENU PRINCIPAL         -->
  <!-- =============================== -->
  <div id="menu">
    <div class="menu-body">
      <div class="menu-hero">
        <h1 id="menuTitle" class="menu-logo">Fast and Spermious</h1>
      </div>

      <div class="mode-cards">
        <button class="mode-card easy" id="btn15" onclick="startGame(15)">
          <span class="mode-num">15<i>s</i></span>
          <span class="mode-sub" id="btn15lbl">Facile</span>
        </button>
        <button class="mode-card medium" id="btn30" onclick="startGame(30)">
          <span class="mode-num">30<i>s</i></span>
          <span class="mode-sub" id="btn30lbl">Moyen</span>
        </button>
        <button class="mode-card hard" id="btn60" onclick="startGame(60)">
          <span class="mode-num">60<i>s</i></span>
          <span class="mode-sub" id="btn60lbl">Intense</span>
        </button>
      </div>

      <div class="menu-actions">
        <button class="menu-btn" id="btnLeaderboard" onclick="openLeaderboardSelect()">Classement</button>
        <button class="menu-btn" id="btnShop" onclick="openShop()">Boutique</button>
        <button class="menu-btn premium" id="btnPremium" onclick="buyPremium()" style="display:none;">Passer Premium</button>
      </div>

      <div id="userLabel"></div>

      <!-- ===== LANGUES ===== -->
      <div class="lang-select">
        <button class="lang-btn" onclick="setLang('fr')" style="background-image:url('img/flags/fr.png')">
          <span>FR</span>
        </button>
        <button class="lang-btn" onclick="setLang('en')" style="background-image:url('img/flags/en.png')">
          <span>EN</span>
        </button>
        <button class="lang-btn" onclick="setLang('es')" style="background-image:url('img/flags/es.png')">
          <span>ES</span>
        </button>
      </div>
    </div>
  </div>

  <!-- =============================== -->
  <!--             CANVAS              -->
  <!-- =============================== -->
  <canvas id="gameCanvas"></canvas>

  <!-- =============================== -->
<!--           COUNTDOWN             -->
<!-- =============================== -->
<div id="countdown" class="countdown" style="display:none;"></div>

  <!-- =============================== -->
  <!--     CLASSEMENT : SÉLECTION      -->
  <!-- =============================== -->
  <div id="leaderboardSelect" class="panel">
    <h2 id="leaderboardSelectTitle"></h2>
    <p id="leaderboardSelectInstruction"></p>

    <div class="leaderboard-tabs">
      <button class="menu-btn" onclick="switchLeaderboard(15)">15s</button>
      <button class="menu-btn" onclick="switchLeaderboard(30)">30s</button>
      <button class="menu-btn" onclick="switchLeaderboard(60)">60s</button>
    </div>

    <button id="backBtn" class="menu-btn" onclick="backToMenu()">Retour</button>
  </div>

  <!-- =============================== -->
  <!--           LEADERBOARD           -->
  <!-- =============================== -->
  <div id="leaderboard" class="panel">
    <h2 id="lbTitle">Classement</h2>

    <!-- Score total du joueur -->
    <div id="myScore"></div>

    <div class="leaderboard-tabs">
      <button class="menu-btn tab-btn" onclick="switchLeaderboard(15)">15s</button>
      <button class="menu-btn tab-btn" onclick="switchLeaderboard(30)">30s</button>
      <button class="menu-btn tab-btn" onclick="switchLeaderboard(60)">60s</button>
    </div>

    <div id="scores"></div>

    <button class="menu-btn" onclick="closeLeaderboard()">Retour</button>
  </div>

  <!-- =============================== -->
  <!--            GAME OVER            -->
  <!-- =============================== -->
  <div id="gameover" class="panel">
    <h2 id="gameoverTitle"></h2>
    <p id="finalStats"></p>

    <input id="playerName" placeholder="Name">
    <p id="errorMsg"></p>

    <button id="submitBtn" class="menu-btn" onclick="submitScore()">Send</button>
    <button id="menuFromGameBtn" class="menu-btn" onclick="backToMenu()">Menu</button>
  </div>

  <!-- =============================== -->
  <!--               SHOP              -->
  <!-- =============================== -->
  <div id="shop" class="panel">
    <h2 id="shopTitle"></h2>
    <p id="shopStats"></p>
    <div id="shopList"></div>
    <button id="shopCloseBtn" class="menu-btn" onclick="closeShop()">Close</button>
  </div>

  <!-- =============================== -->
  <!--            VERSION              -->
  <!-- =============================== -->
  <div id="versionTag"></div>

  <script>
    function dbg() { console.log(...arguments); }
  </script>

  <!-- =============================== -->
  <!--           SCRIPTS JS            -->
  <!-- =============================== -->
  <script src="js/background.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/models.js"></script>
  <script src="js/managers/AuthManager.js"></script>
  <script src="js/managers/AdManager.js"></script>
  <script src="js/managers/PurchaseManager.js"></script>
  <script src="js/managers/ProfileManager.js"></script>
  <script src="js/managers/SkinManager.js"></script>
  <script src="js/managers/LeaderboardManager.js"></script>
  <script src="js/managers/InputManager.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/playGames.js"></script>
  <script src="js/game.js"></script>

  <!-- INTRO STUDIO (TOUJOURS EN DERNIER) -->
  <script src="js/intro.js"></script>

</body>
</html>
